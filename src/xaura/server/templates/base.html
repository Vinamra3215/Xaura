<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="XAURA - eXtendable Automated Unified Research & Analytics">
    <title>{% block title %}XAURA{% endblock %}</title>

    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">

    <!-- Plotly.js CDN -->
    <script src="https://cdn.plot.ly/plotly-2.35.2.min.js" charset="utf-8"></script>

    <!-- App CSS -->
    <link rel="stylesheet" href="/static/css/style.css">

    {% block head %}{% endblock %}
</head>

<body>
    <!-- ── Navbar ─────────────────────────────────────────────── -->
    <nav class="navbar">
        <div class="nav-container">
            <a href="/" class="nav-brand">
                <span class="nav-logo">X</span>
                <span class="nav-title">XAURA</span>
            </a>
            <div class="nav-links">
                <a href="/" class="nav-link {% block nav_home %}{% endblock %}">Home</a>
                <a href="#" class="nav-link {% block nav_profile %}{% endblock %}" id="nav-profile">Profile</a>
                <a href="/experiments" class="nav-link {% block nav_experiments %}{% endblock %}">Experiments</a>
                <a href="#" class="nav-link {% block nav_results %}{% endblock %}" id="nav-results">Results</a>
            </div>
        </div>
    </nav>

    <!-- ── Main Content ───────────────────────────────────────── -->
    <main class="main-content">
        {% block content %}{% endblock %}
    </main>

    <!-- ── Footer ─────────────────────────────────────────────── -->
    <footer class="footer">
        <div class="footer-container">
            <span class="footer-brand">XAURA-1.0</span>
            <span class="footer-tagline">eXtendable Automated Unified Research & Analytics</span>
        </div>
    </footer>

    <!-- App JS -->
    <script src="/static/js/app.js"></script>
    {% block scripts %}{% endblock %}
</body>

</html>
